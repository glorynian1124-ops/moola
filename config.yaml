# Moola 配置文件

# AI 分类用的大模型 API（DeepSeek，按量计费，几分钱一次）
# 也可以换成其他 OpenAI 兼容接口
llm:
  provider: deepseek          # deepseek | openai | dashscope ...
  base_url: https://api.deepseek.com/v1
  api_key: ""                 # 放在环境变量 MOOLA_API_KEY 或这里
  model: deepseek-chat
  max_calls_per_day: 30       # 每日 AI 调用上限，控制成本

# 默认分类规则（关键词 → 分类），AI 不可用时兜底
# 首次初始化会写入 category_rules 表（source=import），之后可在表中持续学习
category_rules:
  餐饮: [美团, 饿了么, 外卖, 餐厅, 饭店, 食堂, 奶茶, 咖啡, 麦当劳, 肯德基, 瑞幸, 星巴克,
        蜜雪冰城, 喜茶, 海底捞, 烧烤, 火锅, 汉堡, 面馆, 早餐, 包子, 麻辣烫]
  交通: [滴滴, 出租车, 高德打车, 地铁, 公交, 加油, 中石油, 中石化, 高铁, 火车, 机票, 停车,
        共享单车, "12306", 顺风车]
  购物: [淘宝, 京东, 拼多多, 天猫, 超市, 便利店, 沃尔玛, 名创, 优衣库, 无印良品, 屈臣氏,
        唯品会, 抖音商城, 电商]
  居住: [房租, 押金, 电费, 水费, 燃气, 物业, 供暖, 装修, 房东]
  通讯: [话费, 宽带, 中国移动, 中国联通, 中国电信, 流量包]
  娱乐: [电影, 万达影城, 游戏, Steam, 网吧, KTV, 视频会员, 音乐, 演唱会, 剧本杀, 密室,
        游乐园, 旅游]
  医疗: [医院, 药店, 诊所, 挂号, 体检, 口腔, 牙科, 京东健康, 阿里健康]
  教育: [课程, 学费, 书本, 书店, 考试, 培训, 知识付费, 得到, 极客时间]
  水果: [水果, 百果园, 果切, 鲜丰]
  零食: [零食, 良品铺子, 三只松鼠, 面包, 蛋糕, 零食很忙]
  服饰: [服饰, 衣, 鞋, 优衣库, 海澜之家, 运动服, 阿迪, 耐克]
  日用: [日用, 家乐福, 生活用品, 大润发, 永辉]
  转账: [转账, 还款, 花呗, 借呗, 信用卡还款]
  其他支出: [其他]
  工资: [工资, 薪酬, 薪资, 劳务费]
  奖金: [奖金, 年终奖, 绩效]
  报销: [报销, 差旅报销]
  退款: [退款, 退货]
  兼职: [兼职, 稿费, 打赏]
  理财: [理财, 利息, 分红, 基金, 余额宝收益]
  红包: [微信红包, 支付宝红包]

# 默认预算（分类 → 月度限额，元），用户可在页面自定义
default_budget:
  餐饮: 1200
  交通: 300
  购物: 800
  居住: 1500
  娱乐: 300
  医疗: 200
  教育: 200

# 服务器
server:
  host: 0.0.0.0        # 手机通过局域网访问
  port: 5001
