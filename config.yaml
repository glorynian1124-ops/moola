# Moola 配置文件

# AI 分类用的大模型 API（DeepSeek，按量计费，几分钱一次）
# 也可以换成其他 OpenAI 兼容接口
llm:
  provider: deepseek          # deepseek | openai | dashscope ...
  base_url: https://api.deepseek.com/v1
  api_key: ""                 # 放在环境变量 MOOLA_API_KEY 或这里
  model: deepseek-chat
  max_calls_per_day: 30       # 每日 AI 调用上限，控制成本

# 默认分类规则（关键词 → 分类），AI 不可用时兜底
category_rules:
  餐饮: [外卖, 美团, 饿了么, 餐厅, 饭店, 食堂, 奶茶, 咖啡, 麦当劳, 肯德基, 瑞幸, 星巴克]
  交通: [滴滴, 出租车, 地铁, 公交, 加油, 高铁, 火车, 机票, 停车]
  购物: [淘宝, 京东, 拼多多, 天猫, 超市, 便利店, 沃尔玛, 名创]
  居住: [房租, 水电, 燃气, 物业, 宽带, 话费]
  娱乐: [电影, 游戏, 网吧, KTV, 视频会员, 音乐, 演唱会]
  医疗: [医院, 药店, 诊所, 挂号]
  教育: [课程, 学费, 书本, 书店, 考试]
  转账: [转账, 红包]
  收入: [工资, 奖金, 退款, 报销]

# 默认预算（分类 → 月度限额，元），用户可在页面自定义
default_budget:
  餐饮: 1200
  交通: 300
  购物: 800
  居住: 1500
  娱乐: 300
  医疗: 200
  教育: 200

# 服务器
server:
  host: 0.0.0.0        # 手机通过局域网访问
  port: 5001
